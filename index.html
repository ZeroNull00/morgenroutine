<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10+ Minuten Morgentraining</title>
<style>
:root{--bg:#0b1220;--card:#111827;--card2:#1f2937;--text:#f8fafc;--muted:#a7b0c0;--accent:#22c55e;--warn:#f59e0b;--danger:#ef4444;--border:rgba(255,255,255,.12)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#1e3a5f 0,#0b1220 55%);color:var(--text)}
header{padding:24px 16px 10px;text-align:center}
h1{margin:0;font-size:clamp(2rem,5vw,4rem);letter-spacing:-.04em}
.subtitle{color:var(--muted);margin-top:8px}
.app{max-width:1180px;margin:auto;padding:16px;display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.timer-card,.list-card{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid var(--border);border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.image-wrap{width:100%;height:390px;background:#f7f7f7;display:flex;align-items:center;justify-content:center;padding:10px}
img.exercise{max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:10px}
@media(max-width:600px){.image-wrap{height:260px}}
.timer-content{padding:22px}
.phase{display:inline-flex;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#052e16;background:var(--accent);border-radius:999px;padding:7px 12px;font-size:.8rem}
.exercise-title{margin:18px 0 6px;font-size:clamp(1.8rem,5vw,3.4rem);line-height:1;letter-spacing:-.05em}
.exercise-note{color:var(--muted);font-size:1.05rem;min-height:1.4em}
.clock{margin:22px 0 12px;font-size:clamp(4rem,16vw,8.5rem);line-height:.9;font-weight:950;font-variant-numeric:tabular-nums;letter-spacing:-.08em}
.progress{height:14px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden}
.bar{height:100%;width:0%;background:linear-gradient(90deg,var(--warn),var(--accent));transition:width .2s linear}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button{border:0;border-radius:16px;padding:14px 18px;font-size:1rem;font-weight:900;cursor:pointer;color:#052e16;background:var(--accent)}
button.secondary{background:#e5e7eb;color:#111827}.danger{background:var(--danger);color:white}
.meta,.wakelock-status{margin-top:12px;color:var(--muted);font-size:.95rem}
.wakelock-status{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.08)}
.wakelock-status.active{color:var(--accent)}.wakelock-status.unsupported{color:var(--danger)}
.list-card{padding:18px}.list-card h2{margin:0 0 14px}
.step{display:grid;grid-template-columns:80px 1fr;gap:12px;padding:12px;border-radius:18px;color:var(--muted);border:1px solid transparent}
.step.current{background:var(--card2);color:white;border-color:var(--warn)}
.time{font-weight:900;color:var(--warn);font-variant-numeric:tabular-nums}
.name{font-weight:850}
</style>
</head>
<body>
<header>
<h1>10+ Minuten Morgentraining</h1>
<div class="subtitle">Finaler Plan · Reverse Lunges · automatischer Bildwechsel · Ton · Screen Wake Lock</div>
</header>

<main class="app">
<section class="timer-card">
<div class="image-wrap"><img id="exerciseImage" class="exercise" src="images/warmup_gehen.png" alt="Gehen auf der Stelle"></div>
<div class="timer-content">
<div id="phase" class="phase">Warm-up</div>
<h2 id="exerciseTitle" class="exercise-title">Gehen auf der Stelle</h2>
<div id="exerciseNote" class="exercise-note">Arme locker mitschwingen, Kreislauf aktivieren.</div>
<div id="clock" class="clock">0:30</div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div class="controls">
<button id="startBtn">▶ Start</button>
<button id="pauseBtn" class="secondary">Pause</button>
<button id="resetBtn" class="danger">Reset</button>
</div>
<div id="meta" class="meta"></div>
<div id="wakeLockStatus" class="wakelock-status">Bildschirm wach halten: noch nicht aktiviert</div>
</div>
</section>
<aside class="list-card"><h2>Timer-Ablauf</h2><div id="steps"></div></aside>
</main>

<script>
const workout=[
{phase:"Warm-up",title:"Gehen auf der Stelle",seconds:30,image:"images/warmup_gehen.png",note:"Arme locker mitschwingen, Kreislauf aktivieren.",start:"0:00"},
{phase:"Warm-up",title:"Schulterkreisen + Arme mobilisieren",seconds:30,image:"images/warmup_schultern.png",note:"Große, kontrollierte Bewegungen. Brust öffnen.",start:"0:30"},
{phase:"Warm-up",title:"Langsame Kniebeugen",seconds:30,image:"images/warmup_kniebeugen.png",note:"Locker und nicht maximal tief. Vorbereitung für die Beine.",start:"1:00"},
{phase:"Training",title:"Knie-Liegestütze",seconds:40,image:"images/knie_liegestuetze.png",note:"Körper stabil, Brust Richtung Boden, ruhig atmen.",start:"1:30"},
{phase:"Pause",title:"Pause",seconds:20,image:"images/knie_liegestuetze.png",note:"Position wechseln, kurz durchatmen.",start:"2:10"},
{phase:"Training",title:"Kniebeugen",seconds:40,image:"images/kniebeugen.png",note:"Kontrolliert runter, kraftvoll hoch. Knie stabil halten.",start:"2:30"},
{phase:"Pause",title:"Pause",seconds:20,image:"images/kniebeugen.png",note:"Kurz lockern.",start:"3:10"},
{phase:"Training",title:"High March",seconds:40,image:"images/high_march.png",note:"Knie aktiv heben, Arme mitnehmen.",start:"3:30"},
{phase:"Pause",title:"Pause",seconds:20,image:"images/high_march.png",note:"Atmung beruhigen.",start:"4:10"},
{phase:"Training",title:"Normale Plank",seconds:40,image:"images/plank.png",note:"Bauch anspannen, kein Hohlkreuz.",start:"4:30"},
{phase:"Pause",title:"Pause",seconds:20,image:"images/plank.png",note:"Kurz lösen und vorbereiten.",start:"5:10"},
{phase:"Training",title:"Knie-Liegestütze Runde 2",seconds:40,image:"images/knie_liegestuetze_2.png",note:"Sauber bleiben, auch wenn es anstrengender wird.",start:"5:30"},
{phase:"Pause",title:"Pause",seconds:20,image:"images/knie_liegestuetze_2.png",note:"Kurz lockern.",start:"6:10"},
{phase:"Training",title:"Lunges nach hinten",seconds:40,image:"images/lunges_nach_hinten.png",note:"Abwechselnd rückwärts ausfallschreiten. Oberkörper aufrecht halten.",start:"6:30"},
{phase:"Pause",title:"Pause",seconds:20,image:"images/lunges_nach_hinten.png",note:"Kurz lockern und zur nächsten Übung wechseln.",start:"7:10"},
{phase:"Training",title:"Step Touch / Seitliches Gehen",seconds:40,image:"images/step_touch.png",note:"Seitlich bewegen, gleichmäßiger Rhythmus.",start:"7:30"},
{phase:"Pause",title:"Pause",seconds:20,image:"images/step_touch.png",note:"Durchatmen.",start:"8:10"},
{phase:"Training",title:"Slow Mountain Climbers am Boden",seconds:40,image:"images/slow_mountain_climbers.png",note:"Langsam, stabil, ohne Hüpfen. Hüfte ruhig halten.",start:"8:30"},
{phase:"Pause",title:"Pause",seconds:20,image:"images/slow_mountain_climbers.png",note:"Letzte Pause vor Rücken/Schulter.",start:"9:10"},
{phase:"Training",title:"Superman Pullback",seconds:40,image:"images/superman_pullback.png",note:"Schulterblätter nach hinten/unten ziehen. Nacken lang halten.",start:"9:30"},
{phase:"Cooldown",title:"Locker gehen & tief atmen",seconds:50,image:"images/cooldown.png",note:"Atmung beruhigen, Schultern lösen.",start:"10:10"}
];

let index=0,remaining=workout[0].seconds,running=false,interval=null,wakeLock=null,audioCtx=null,audioReady=false;
const el=id=>document.getElementById(id);
function fmt(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}

async function unlockAudio(){
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC)return false;
 if(!audioCtx)audioCtx=new AC();
 if(audioCtx.state==="suspended"){try{await audioCtx.resume()}catch(e){}}
 try{
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  g.gain.setValueAtTime(.0001,audioCtx.currentTime);
  o.frequency.value=440;o.start();o.stop(audioCtx.currentTime+.04);
  audioReady=true;return true;
 }catch(e){audioReady=false;return false}
}

function beep(type="normal"){
 if(!audioCtx||!audioReady){if(navigator.vibrate)navigator.vibrate(type==="finish"?[120,80,120]:80);return}
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.connect(g);g.connect(audioCtx.destination);
 o.frequency.value=type==="finish"?880:type==="warning"?660:440;
 g.gain.setValueAtTime(.0001,audioCtx.currentTime);
 g.gain.exponentialRampToValueAtTime(.35,audioCtx.currentTime+.02);
 g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.28);
 o.start(audioCtx.currentTime);o.stop(audioCtx.currentTime+.30);
 if(navigator.vibrate)navigator.vibrate(type==="finish"?[120,80,120]:60);
}

function updateWake(t,c=""){const s=el("wakeLockStatus");s.textContent=t;s.className="wakelock-status"+(c?" "+c:"")}
async function requestWakeLock(){
 if(!("wakeLock"in navigator)){updateWake("Bildschirm wach halten: vom Browser nicht unterstützt","unsupported");return false}
 try{wakeLock=await navigator.wakeLock.request("screen");updateWake("Bildschirm wach halten: aktiv","active");return true}
 catch(e){updateWake("Bildschirm wach halten: konnte nicht aktiviert werden","unsupported");return false}
}
async function releaseWakeLock(){if(wakeLock){try{await wakeLock.release()}catch(e){}wakeLock=null}if("wakeLock"in navigator)updateWake("Bildschirm wach halten: deaktiviert")}

function renderSteps(){
 el("steps").innerHTML=workout.map((w,i)=>`
 <div class="step ${i===index?"current":""}">
   <div class="time">${w.start}</div>
   <div><div class="name">${w.title}</div><div>${w.phase} · ${w.seconds}s</div></div>
 </div>`).join("")
}
function render(){
 const w=workout[index];
 el("phase").textContent=w.phase;
 el("exerciseTitle").textContent=w.title;
 el("exerciseNote").textContent=w.note;
 el("clock").textContent=fmt(remaining);
 el("exerciseImage").src=w.image;
 el("exerciseImage").alt=w.title;
 el("bar").style.width=`${Math.max(0,Math.min(100,((w.seconds-remaining)/w.seconds)*100))}%`;
 el("meta").textContent=`Gesamt: 11:00 · Aktuell: ${index+1} von ${workout.length} · Ton: ${audioReady?"aktiv":"Start tippen zum Aktivieren"}`;
 renderSteps()
}
function tick(){
 if(!running)return;
 if(remaining===3)beep("warning");
 if(remaining>0){remaining--;render();return}
 beep(index===workout.length-1?"finish":"normal");
 if(index<workout.length-1){index++;remaining=workout[index].seconds;render()}
 else{running=false;clearInterval(interval);interval=null;releaseWakeLock();render()}
}
el("startBtn").onclick=async()=>{await unlockAudio();await requestWakeLock();if(running)return;running=true;beep("normal");if(!interval)interval=setInterval(tick,1000);render()}
el("pauseBtn").onclick=()=>{running=false;render()}
el("resetBtn").onclick=async()=>{running=false;clearInterval(interval);interval=null;await releaseWakeLock();index=0;remaining=workout[0].seconds;render()}
document.addEventListener("visibilitychange",async()=>{if(document.hidden){running=false;await releaseWakeLock()}render()})
render()
</script>
</body>
</html>
